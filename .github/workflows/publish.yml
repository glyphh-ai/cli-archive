name: Publish

# How anyone installs the CLI: `npm i -g @glyphh-ai/cli`. A tag `v*` publishes
# the package at the version in package.json.
#
# package.json depends on `@glyphh/sdk: file:../sdk`, a sibling checkout that
# exists on a developer's machine and nowhere else. Publishing that verbatim
# would ship a package nobody can install, so this job vendors the SDK the way
# the desktop's build does (so `npm ci` resolves), builds and tests, and then
# rewrites the dependency to the SDK's published version before `npm publish`.
# The SDK must already be on the registry at that version (sdk's Publish
# workflow). Needs the NPM_TOKEN secret (an npm automation token for the
# @glyphh-ai scope) and a token that can read glyphh-ai/sdk.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm i -g npm@11

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: glyphh-ai/sdk
          token: ${{ secrets.SDK_REPO_TOKEN || secrets.CLIENT_RELEASE_TOKEN }}
          path: .sdk-src
      - name: Build the SDK (file:../sdk dependency)
        run: |
          cd .sdk-src && npm ci && npm run build && cd ..
          rm -rf ../sdk && mkdir -p ../sdk
          cp .sdk-src/package.json ../sdk/package.json
          cp -R .sdk-src/dist ../sdk/dist
          echo "SDK_VERSION=$(node -p "require('./.sdk-src/package.json').version")" >> "$GITHUB_ENV"
          rm -rf .sdk-src

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: The tag must be the package version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${v}" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || { echo "tag ${GITHUB_REF_NAME} is not v${v}"; exit 1; }

      - name: Depend on the published SDK, not the sibling folder
        run: |
          npm pkg set "dependencies.@glyphh/sdk=^${SDK_VERSION}"
          npm view "@glyphh/sdk@${SDK_VERSION}" version >/dev/null || { echo "@glyphh/sdk@${SDK_VERSION} is not on the registry; publish the SDK first"; exit 1; }

      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
