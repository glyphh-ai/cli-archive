name: Publish

# How anyone installs the CLI: `npm i -g @glyphh-ai/cli`. A tag `v*` publishes
# the package at the version in package.json.
#
# The SDK is BUNDLED into dist/main.js (esbuild, `npm run build`), so the
# published package has no @glyphh/sdk dependency and the SDK never has to be on
# the registry. `@glyphh/sdk: file:../sdk` is a devDependency, a sibling checkout
# that exists on a developer's machine and nowhere else: this job clones and
# builds it the way the desktop's build does, so `npm ci` and the bundle resolve.
# Publishes through npm Trusted Publishing (the package's trusted publisher is
# this repo's publish.yml), so no npm token is stored; SDK_REPO_TOKEN reads
# glyphh-ai/sdk.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm i -g npm@11

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: glyphh-ai/sdk
          token: ${{ secrets.SDK_REPO_TOKEN || secrets.CLIENT_RELEASE_TOKEN }}
          path: .sdk-src
      - name: Build the SDK (file:../sdk dependency)
        run: |
          cd .sdk-src && npm ci && npm run build && cd ..
          rm -rf ../sdk && mkdir -p ../sdk
          cp .sdk-src/package.json ../sdk/package.json
          cp -R .sdk-src/dist ../sdk/dist
          rm -rf .sdk-src

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: The tag must be the package version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${v}" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || { echo "tag ${GITHUB_REF_NAME} is not v${v}"; exit 1; }

      - name: The SDK is inside the bundle, not a dependency
        run: |
          if grep -qE 'from "@glyphh/sdk|import\("@glyphh/sdk' dist/main.js; then echo "dist/main.js still imports @glyphh/sdk"; exit 1; fi
          node -e "const p=require('./package.json'); if ((p.dependencies||{})['@glyphh/sdk']) { console.error('@glyphh/sdk must not be a runtime dependency'); process.exit(1) }"

      # npm Trusted Publishing: the job's GitHub identity (id-token: write) signs
      # the publish, so no npm token is stored anywhere. No --provenance: npm
      # accepts provenance only from PUBLIC source repos, and this one is private.
      - run: npm publish --access public
